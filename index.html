<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>App unavailable</title>
<style>
  html,body{height:100%;margin:0;}
  body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:#f4f6fb;color:#1a2036;font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;}
  main{max-width:420px;}
  h1{font-size:22px;margin:0 0 10px;}
  p{margin:0;color:#5c6480;}
  @media (prefers-color-scheme:dark){body{background:#0d1220;color:#e8ebf8;}p{color:#9aa2c4;}}
</style>
</head>
<body>
<main>
  <h1>This app is no longer available.</h1>
  <p>Apologies for the inconvenience.</p>
</main>
<script>
/* clear any saved copy of the old app so it can't reappear offline */
try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}); }catch(e){}
try{ if(window.caches) caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); }catch(e){}
</script>
</body>
</html>
