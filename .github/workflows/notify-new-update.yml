name: Notify parents of new update

on:
  push:
    branches: [main]
    paths:
      - 'index.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification via OneSignal
        run: |
          curl -s -X POST "https://onesignal.com/api/v1/notifications" \
            -H "Authorization: Basic ${{ secrets.ONESIGNAL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
              "included_segments": ["Subscribed Users"],
              "headings": {"en": "Y2K Team Hub"},
              "contents": {"en": "A new update was just posted — tap to check it out."},
              "url": "https://californiacheer.github.io/Y2K/"
            }'
