name: Deadline reminders

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check deadlines and send reminders
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          APP_URL: "https://californiacheer.github.io/Y2K/"
          REMINDER_DAYS: "3"
        run: node scripts/check-deadlines.js

      - name: Commit updated reminder log
        run: |
          git config user.name "y2k-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .deadline-reminders-sent.json
          git diff --cached --quiet || git commit -m "Update sent deadline reminders"
          git push
